name: Build 30 Video App APK

on:
  push:
    branches: [ "main", "master" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: Set up JDK 17
      uses: actions/setup-java@v4
      with:
        java-version: '17'
        distribution: 'temurin'

    - name: Setup Gradle 8.2
      uses: gradle/actions/setup-gradle@v3
      with:
        gradle-version: '8.2'

    - name: Generate Complete Android Folders & Source Code
      run: |
        # 1. Folders Create करना
        mkdir -p app/src/main/java/com/app/thirtyvideo
        mkdir -p app/src/main/res/layout
        mkdir -p app/src/main/res/values

        # 2. settings.gradle
        cat << 'EOF' > settings.gradle
        pluginManagement {
            repositories {
                google()
                mavenCentral()
                gradlePluginPortal()
            }
        }
        dependencyResolutionManagement {
            repositoriesMode.set(RepositoriesMode.FAIL_ON_PROJECT_REPOS)
            repositories {
                google()
                mavenCentral()
            }
        }
        rootProject.name = "ThirtyVideo"
        include ':app'
        EOF

        # 3. Root build.gradle
        cat << 'EOF' > build.gradle
        plugins {
            id 'com.android.application' version '8.2.0' apply false
            id 'org.jetbrains.kotlin.android' version '1.9.20' apply false
        }
        EOF

        # 4. App Level build.gradle
        cat << 'EOF' > app/build.gradle
        plugins {
            id 'com.android.application'
            id 'org.jetbrains.kotlin.android'
        }

        android {
            namespace 'com.app.thirtyvideo'
            compileSdk 34

            defaultConfig {
                applicationId "com.app.thirtyvideo"
                minSdk 24
                targetSdk 34
                versionCode 1
                versionName "1.0"
            }

            compileOptions {
                sourceCompatibility JavaVersion.VERSION_17
                targetCompatibility JavaVersion.VERSION_17
            }
            kotlinOptions {
                jvmTarget = '17'
            }
        }

        dependencies {
            implementation 'androidx.core:core-ktx:1.12.0'
            implementation 'androidx.appcompat:appcompat:1.6.1'
            implementation 'com.google.android.material:material:1.11.0'
            implementation 'androidx.recyclerview:recyclerview:1.3.2'
            
            // Google Media3 / ExoPlayer Video Engine
            implementation 'androidx.media3:media3-exoplayer:1.2.1'
            implementation 'androidx.media3:media3-ui:1.2.1'
        }
        EOF

        # 5. Theme Resource (Fixes App Crash)
        cat << 'EOF' > app/src/main/res/values/styles.xml
        <?xml version="1.0" encoding="utf-8"?>
        <resources>
            <style name="AppTheme" parent="Theme.MaterialComponents.DayNight.NoActionBar">
                <item name="colorPrimary">#6200EE</item>
            </style>
        </resources>
        EOF

        # 6. AndroidManifest.xml (App Name: 30 Video + Media Permissions)
        cat << 'EOF' > app/src/main/AndroidManifest.xml
        <?xml version="1.0" encoding="utf-8"?>
        <manifest xmlns:android="http://schemas.android.com/apk/res/android">

            <uses-permission android:name="android.permission.READ_EXTERNAL_STORAGE" android:maxSdkVersion="32" />
            <uses-permission android:name="android.permission.READ_MEDIA_VIDEO" />

            <application
                android:allowBackup="true"
                android:label="30 Video"
                android:supportsRtl="true"
                android:theme="@style/AppTheme">
                <activity
                    android:name=".MainActivity"
                    android:exported="true"
                    android:configChanges="orientation|screenSize|keyboardHidden">
                    <intent-filter>
                        <action android:name="android.intent.action.MAIN" />
                        <category android:name="android.intent.category.LAUNCHER" />
                    </intent-filter>
                </activity>
            </application>
        </manifest>
        EOF

        # 7. Layout Main Screen (Player + Video List)
        cat << 'EOF' > app/src/main/res/layout/activity_main.xml
        <?xml version="1.0" encoding="utf-8"?>
        <LinearLayout xmlns:android="http://schemas.android.com/apk/res/android"
            android:layout_width="match_parent"
            android:layout_height="match_parent"
            android:orientation="vertical"
            android:background="#121212">

            <androidx.media3.ui.PlayerView
                android:id="@+id/playerView"
                android:layout_width="match_parent"
                android:layout_height="250dp"
                android:background="#000000" />

            <androidx.recyclerview.widget.RecyclerView
                android:id="@+id/recyclerView"
                android:layout_width="match_parent"
                android:layout_height="match_parent"
                android:padding="8dp" />

        </LinearLayout>
        EOF

        # 8. Layout Single Video Item List
        cat << 'EOF' > app/src/main/res/layout/item_video.xml
        <?xml version="1.0" encoding="utf-8"?>
        <LinearLayout xmlns:android="http://schemas.android.com/apk/res/android"
            android:layout_width="match_parent"
            android:layout_height="wrap_content"
            android:orientation="vertical"
            android:padding="12dp"
            android:layout_marginBottom="6dp"
            android:background="#1E1E1E">

            <TextView
                android:id="@+id/tvTitle"
                android:layout_width="match_parent"
                android:layout_height="wrap_content"
                android:textColor="#FFFFFF"
                android:textSize="16sp"
                android:textStyle="bold"
                android:maxLines="1"
                android:ellipsize="end" />

            <TextView
                android:id="@+id/tvSub"
                android:layout_width="match_parent"
                android:layout_height="wrap_content"
                android:textColor="#AAAAAA"
                android:textSize="12sp"
                android:layout_marginTop="4dp" />
        </LinearLayout>
        EOF

        # 9. Kotlin Source Code (Permissions + MediaStore Scan + RecyclerView + ExoPlayer)
        cat << 'EOF' > app/src/main/java/com/app/thirtyvideo/MainActivity.kt
        package com.app.thirtyvideo

        import android.Manifest
        import android.content.ContentUris
        import android.content.pm.PackageManager
        import android.net.Uri
        import android.os.Build
        import android.os.Bundle
        import android.provider.MediaStore
        import android.view.LayoutInflater
        import android.view.View
        import android.view.ViewGroup
        import android.widget.TextView
        import android.widget.Toast
        import androidx.appcompat.app.AppCompatActivity
        import androidx.core.app.ActivityCompat
        import androidx.core.content.ContextCompat
        import androidx.media3.common.MediaItem
        import androidx.media3.exoplayer.ExoPlayer
        import androidx.media3.ui.PlayerView
        import androidx.recyclerview.widget.LinearLayoutManager
        import androidx.recyclerview.widget.RecyclerView

        data class VideoModel(val id: Long, val name: String, val uri: Uri)

        class MainActivity : AppCompatActivity() {

            private lateinit var player: ExoPlayer
            private lateinit var playerView: PlayerView
            private lateinit var recyclerView: RecyclerView
            private val PERMISSION_REQ_CODE = 101

            override fun onCreate(savedInstanceState: Bundle?) {
                super.onCreate(savedInstanceState)
                setContentView(R.layout.activity_main)

                playerView = findViewById(R.id.playerView)
                recyclerView = findViewById(R.id.recyclerView)
                recyclerView.layoutManager = LinearLayoutManager(this)

                player = ExoPlayer.Builder(this).build()
                playerView.player = player

                checkAndRequestPermissions()
            }

            private fun checkAndRequestPermissions() {
                val permission = if (Build.VERSION.SDK_INT >= Build.VERSION_CODES.TIRAMISU) {
                    Manifest.permission.READ_MEDIA_VIDEO
                } else {
                    Manifest.permission.READ_EXTERNAL_STORAGE
                }

                if (ContextCompat.checkSelfPermission(this, permission) != PackageManager.PERMISSION_GRANTED) {
                    ActivityCompat.requestPermissions(this, arrayOf(permission), PERMISSION_REQ_CODE)
                } else {
                    scanAndDisplayVideos()
                }
            }

            override fun onRequestPermissionsResult(
                requestCode: Int,
                permissions: Array<out String>,
                grantResults: IntArray
            ) {
                super.onRequestPermissionsResult(requestCode, permissions, grantResults)
                if (requestCode == PERMISSION_REQ_CODE && grantResults.isNotEmpty() && grantResults[0] == PackageManager.PERMISSION_GRANTED) {
                    scanAndDisplayVideos()
                } else {
                    Toast.makeText(this, "वीडियो स्कैन करने के लिए परमिशन ज़रूरी है!", Toast.LENGTH_LONG).show()
                }
            }

            private fun scanAndDisplayVideos() {
                val videos = mutableListOf<VideoModel>()
                val projection = arrayOf(
                    MediaStore.Video.Media._ID,
                    MediaStore.Video.Media.DISPLAY_NAME
                )

                contentResolver.query(
                    MediaStore.Video.Media.EXTERNAL_CONTENT_URI,
                    projection, null, null, MediaStore.Video.Media.DATE_ADDED + " DESC"
                )?.use { cursor ->
                    val idCol = cursor.getColumnIndexOrThrow(MediaStore.Video.Media._ID)
                    val nameCol = cursor.getColumnIndexOrThrow(MediaStore.Video.Media.DISPLAY_NAME)

                    while (cursor.moveToNext()) {
                        val id = cursor.getLong(idCol)
                        val name = cursor.getString(nameCol) ?: "Video"
                        val contentUri = ContentUris.withAppendedId(MediaStore.Video.Media.EXTERNAL_CONTENT_URI, id)
                        videos.add(VideoModel(id, name, contentUri))
                    }
                }

                if (videos.isNotEmpty()) {
                    recyclerView.adapter = VideoAdapter(videos) { selectedVideo ->
                        playVideo(selectedVideo)
                    }
                    playVideo(videos[0]) // Play first video by default
                    Toast.makeText(this, "${videos.size} वीडियो मिले!", Toast.LENGTH_SHORT).show()
                } else {
                    Toast.makeText(this, "मोबाइल में कोई वीडियो नहीं मिला!", Toast.LENGTH_SHORT).show()
                }
            }

            private fun playVideo(video: VideoModel) {
                val mediaItem = MediaItem.fromUri(video.uri)
                player.setMediaItem(mediaItem)
                player.playWhenReady = true
                player.prepare()
            }

            override fun onStop() {
                super.onStop()
                player.pause()
            }

            override fun onDestroy() {
                super.onDestroy()
                player.release()
            }

            inner class VideoAdapter(
                private val list: List<VideoModel>,
                private val onClick: (VideoModel) -> Unit
            ) : RecyclerView.Adapter<VideoAdapter.ViewHolder>() {

                inner class ViewHolder(v: View) : RecyclerView.ViewHolder(v) {
                    val tvTitle: TextView = v.findViewById(R.id.tvTitle)
                    val tvSub: TextView = v.findViewById(R.id.tvSub)
                }

                override fun onCreateViewHolder(parent: ViewGroup, viewType: Int): ViewHolder {
                    val v = LayoutInflater.from(parent.context).inflate(R.layout.item_video, parent, false)
                    return ViewHolder(v)
                }

                override fun onBindViewHolder(holder: ViewHolder, position: Int) {
                    val item = list[position]
                    holder.tvTitle.text = item.name
                    holder.tvSub.text = "Tap to play video"
                    holder.itemView.setOnClickListener { onClick(item) }
                }

                override fun getItemCount() = list.size
            }
        }
        EOF

    - name: Generate Wrapper & Build APK
      run: |
        gradle wrapper --gradle-version 8.2
        chmod +x gradlew
        ./gradlew assembleDebug

    - name: Upload Built APK
      uses: actions/upload-artifact@v4
      with:
        name: 30-Video-APK
        path: app/build/outputs/apk/debug/app-debug.apk
        
