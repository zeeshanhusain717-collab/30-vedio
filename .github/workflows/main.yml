                      }
                      setOnClickListener { openCompactColorPicker() }
                  }

                  val styleMenuBtn = Button(this).apply {
                      text = "📄 Style"
                      textSize = 13f
                      setTextColor(Color.parseColor("#3D2314"))
                      setTypeface(null, Typeface.BOLD)
                      background = GradientDrawable().apply {
                          setColor(Color.WHITE)
                          cornerRadius = 20f
                          setStroke(2, Color.parseColor("#3D2314"))
                      }
                      layoutParams = LinearLayout.LayoutParams(-2, -2).apply { setMargins(15, 0, 0, 0) }
                      setOnClickListener { showPageStyleDialog() }
                  }

                  lockToggleBtn = Button(this).apply {
                      text = "🔒"
                      textSize = 15f
                      background = GradientDrawable().apply {
                          setColor(Color.WHITE)
                          cornerRadius = 20f
                          setStroke(2, Color.parseColor("#3D2314"))
                      }
                      layoutParams = LinearLayout.LayoutParams(-2, -2).apply { setMargins(15, 0, 0, 0) }
                      setOnClickListener { toggleEditorLockState() }
                  }

                  styleToolBar.addView(colorMenuBtn)
                  styleToolBar.addView(styleMenuBtn)
                  styleToolBar.addView(lockToggleBtn)

                  noteEditText = DynamicCanvasEditText(this).apply {
                      hint = "Write your notice here..."
                      textSize = 16f
                      setPadding(40, 40, 40, 40)
                      gravity = Gravity.TOP
                      setBackgroundColor(Color.TRANSPARENT)
                      layoutParams = LinearLayout.LayoutParams(-1, -1)
                  }

                  noteEditText.addTextChangedListener(object : TextWatcher {
                      private var startPos = 0
                      private var countAdded = 0

                      override fun beforeTextChanged(s: CharSequence?, start: Int, count: Int, after: Int) {}
                      override fun onTextChanged(s: CharSequence?, start: Int, before: Int, count: Int) {
                          startPos = start
                          countAdded = count
                      }
                      override fun afterTextChanged(editable: Editable?) {
                          if (editable == null || isSelfTextChange || countAdded <= 0) return
                          
                          if (isMemoryFull()) {
                              showMemoryFullPopUp()
                              isPageEditorLocked = true
                              applyEditorLockUI()
                              return
                          }

                          isSelfTextChange = true
                          editable.setSpan(
                              ForegroundColorSpan(activeColor),
                              startPos,
                              startPos + countAdded,
                              Spannable.SPAN_EXCLUSIVE_EXCLUSIVE
                          )
                          isSelfTextChange = false
                          // FIX: Removed sync storage usage call from TextWatcher (Avoids lag/Freeze when typing fast)
                      }
                  })

                  editorLayout.addView(styleToolBar)
                  editorLayout.addView(noteEditText)

                  val fabLayout = FrameLayout(this).apply {
                      layoutParams = LinearLayout.LayoutParams(-1, -2)
                  }
                  val fabBtn = Button(this).apply {
                      text = "+"
                      textSize = 30f
                      setTextColor(Color.WHITE)
                      background = GradientDrawable().apply {
                          shape = GradientDrawable.OVAL
                          setColor(Color.parseColor("#3D2314"))
                      }
                      layoutParams = FrameLayout.LayoutParams(130, 130).apply {
                          gravity = Gravity.END or Gravity.BOTTOM
                          setMargins(0, 0, 40, 40)
                      }
                      setOnClickListener { 
                          if (isMemoryFull()) {
                              showMemoryFullPopUp()
                          } else {
                              showAddSelectionDialog() 
                          }
