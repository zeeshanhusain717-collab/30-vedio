name: Build Zeeshan Notice App APK

on:
  push:
    branches:
      - main
      - master
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: Step-by-Step Android Build Pipeline
    runs-on: ubuntu-latest

    steps:
      # ==========================================
      # STEP 1: GitHub Repository & Environment Setup
      # ==========================================
      - name: "Robot Step 01: Checkout Code Repository"
        uses: actions/checkout@v4

      - name: "Robot Step 02: Setup Java OpenJDK 17"
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: "Robot Step 03: Initialize Android SDK Components & NDK"
        run: |
          set -euo pipefail
          yes | $ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager --licenses >/dev/null || true
          $ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager "platform-tools" "platforms;android-34" "build-tools;34.0.0" "ndk;25.2.9519653" "cmake;3.22.1"

      # ==========================================
      # STEP 2: Modular Directory Creation
      # ==========================================
      - name: "Robot Step 04: Create Root, Source & Native CPP Directories"
        run: |
          set -euo pipefail
          mkdir -p app/src/main/java/com/zeeshan/notice
          mkdir -p app/src/main/cpp

      - name: "Robot Step 05: Create Resource & Asset Directories"
        run: |
          set -euo pipefail
          mkdir -p app/src/main/res/values
          mkdir -p app/src/main/res/drawable
          mkdir -p app/src/main/res/mipmap-anydpi-v26
          mkdir -p app/src/main/res/layout
          mkdir -p app/src/main/res/menu

      # ==========================================
      # STEP 3: System Gradle Configuration
      # ==========================================
      - name: "Robot Step 06: Configure Gradle Performance Properties"
        run: |
          cat > gradle.properties <<'EOF'
          org.gradle.jvmargs=-Xmx4096m -Dfile.encoding=UTF-8
          android.useAndroidX=true
          android.nonTransitiveRClass=true
          org.gradle.daemon=false
          EOF

      - name: "Robot Step 07: Configure Settings Gradle Project Tree"
        run: |
          cat > settings.gradle <<'EOF'
          pluginManagement {
              repositories { google(); mavenCentral(); gradlePluginPortal() }
          }
          dependencyResolutionManagement {
              repositoriesMode.set(RepositoriesMode.FAIL_ON_PROJECT_REPOS)
              repositories { google(); mavenCentral() }
          }
          rootProject.name = "ZeeshanNotice"
          include(":app")
          EOF

      - name: "Robot Step 08: Configure Root Build Script"
        run: |
          cat > build.gradle <<'EOF'
          plugins {
              id "com.android.application" version "8.2.2" apply false
              id "org.jetbrains.kotlin.android" version "1.9.22" apply false
          }
          EOF

      - name: "Robot Step 09: Download & Link Gradle Wrapper"
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.5"

      # ==========================================
      # STEP 4: C++ Native Storage Engine Setup
      # ==========================================
      - name: "Robot Step 10: Create C++ Native Code for App Server Storage Calculation"
        run: |
          cat > app/src/main/cpp/native-lib.cpp <<'EOF'
          #include <jni.h>
          #include <string>
          #include <sys/stat.h>
          #include <dirent.h>

          jlong calculateDirectorySize(const char* dirPath) {
              jlong totalSize = 0;
              DIR* dir = opendir(dirPath);
              if (dir == NULL) return 0;

              struct dirent* entry;
              while ((entry = readdir(dir)) != NULL) {
                  if (strcmp(entry->d_name, ".") == 0 || strcmp(entry->d_name, "..") == 0) continue;

                  std::string fullPath = std::string(dirPath) + "/" + entry->d_name;
                  struct stat statbuf;
                  // FIX 3: lstat prevents infinite recursion due to symlinks
                  if (lstat(fullPath.c_str(), &statbuf) == 0) {
                      if (S_ISDIR(statbuf.st_mode)) {
                          totalSize += calculateDirectorySize(fullPath.c_str());
                      } else {
                          totalSize += statbuf.st_size;
                      }
                  }
              }
              closedir(dir);
              return totalSize;
          }

          extern "C" JNIEXPORT jlong JNICALL
          Java_com_zeeshan_notice_MainActivity_getStorageUsageBytes(JNIEnv* env, jobject instance, jstring appDirPath) {
              if (appDirPath == NULL) return 0;
              const char* path = env->GetStringUTFChars(appDirPath, 0);
              jlong usedBytes = calculateDirectorySize(path);
              env->ReleaseStringUTFChars(appDirPath, path);
              return usedBytes;
          }
          EOF

      - name: "Robot Step 11: Create CMakeLists.txt Build Configuration"
        run: |
          cat > app/src/main/cpp/CMakeLists.txt <<'EOF'
          cmake_minimum_required(VERSION 3.22.1)
          project("notice")
          add_library(native-lib SHARED native-lib.cpp)
          find_library(log-lib log)
          # FIX 2: Ensuring safe linking with Android Native libraries
          target_link_libraries(native-lib ${log-lib})
          EOF

      - name: "Robot Step 12: Configure Module App build.gradle with C++ Support"
        run: |
          cat > app/build.gradle <<'EOF'
          plugins {
              id "com.android.application"
              id "org.jetbrains.kotlin.android"
          }

          android {
              namespace "com.zeeshan.notice"
              compileSdk 34

              defaultConfig {
                  applicationId "com.zeeshan.notice"
                  minSdk 26
                  targetSdk 34
                  versionCode 1
                  versionName "1.0"

                  externalNativeBuild {
                      cmake {
                          cppFlags ""
                      }
                  }
              }

              externalNativeBuild {
                  cmake {
                      path "src/main/cpp/CMakeLists.txt"
                      version "3.22.1"
                  }
              }

              buildTypes {
                  release {
                      minifyEnabled false
                  }
              }

              compileOptions {
                  sourceCompatibility JavaVersion.VERSION_17
                  targetCompatibility JavaVersion.VERSION_17
              }
              kotlinOptions { jvmTarget = "17" }
          }

          dependencies {
              implementation "androidx.core:core-ktx:1.13.1"
              implementation "androidx.appcompat:appcompat:1.7.0"
              implementation "com.google.android.material:material:1.12.0"
              implementation "androidx.constraintlayout:constraintlayout:2.1.4"
              implementation "androidx.drawerlayout:drawerlayout:1.2.0"
              implementation "androidx.viewpager2:viewpager2:1.1.0"
          }
          EOF

      # ==========================================
      # STEP 5: UI Design, Theme & Layout Resources
      # ==========================================
      - name: "Robot Step 13: Create App Strings Configuration"
        run: |
          cat > app/src/main/res/values/strings.xml <<'EOF'
          <?xml version="1.0" encoding="utf-8"?>
          <resources>
              <string name="app_name">Zeeshan Notice</string>
              <string name="dashboard_title">𝐙𝐞𝐞𝐬𝐡𝐚𝐧 𝐍𝐨𝐭𝐢𝐜𝐞</string>
          </resources>
          EOF

      - name: "Robot Step 14: Create VIP Chocolate Theme Color Palette"
        run: |
          cat > app/src/main/res/values/colors.xml <<'EOF'
          <?xml version="1.0" encoding="utf-8"?>
          <resources>
              <color name="chocolate_dark">#2B170C</color>
              <color name="chocolate_main">#3D2314</color>
              <color name="chocolate_light">#5A3822</color>
              <color name="white">#FFFFFF</color>
              <color name="bg_cream">#FDFBF7</color>
              <color name="text_dark">#1C100A</color>
              <color name="gold_accent">#D4AF37</color>
              <color name="progress_green">#2ECC71</color>
              <color name="progress_red">#E74C3C</color>
          </resources>
          EOF

      - name: "Robot Step 15: Create Completely Clean Empty Drawer Navigation Menu"
        run: |
          cat > app/src/main/res/menu/drawer_menu.xml <<'EOF'
          <?xml version="1.0" encoding="utf-8"?>
          <menu xmlns:android="http://schemas.android.com/apk/res/android">
              <!-- Empty Menu as requested by user -->
          </menu>
          EOF

      # ==========================================
      # STEP 6: Icons & Branding Generation
      # ==========================================
      - name: "Robot Step 16: Generate 3D Icon Background Asset"
        run: |
          cat > app/src/main/res/drawable/ic_launcher_bg.xml <<'EOF'
          <vector xmlns:android="http://schemas.android.com/apk/res/android"
              xmlns:aapt="http://schemas.android.com/aapt"
              android:width="108dp"
              android:height="108dp"
              android:viewportWidth="108"
              android:viewportHeight="108">
              <path android:pathData="M0,0h108v108h-108z">
                  <aapt:attr name="android:fillColor">
                      <gradient
                          android:startX="0"
                          android:startY="0"
                          android:endX="108"
                          android:endY="108"
                          android:type="linear">
                          <item android:offset="0.0" android:color="#5A3822"/>
                          <item android:offset="1.0" android:color="#2B170C"/>
                      </gradient>
                  </aapt:attr>
              </path>
          </vector>
          EOF

      - name: "Robot Step 17: Generate 3D White Z Foreground Vector"
        run: |
          cat > app/src/main/res/drawable/ic_launcher_fg.xml <<'EOF'
          <vector xmlns:android="http://schemas.android.com/apk/res/android"
              android:width="108dp"
              android:height="108dp"
              android:viewportWidth="108"
              android:viewportHeight="108">
              <path
                  android:fillColor="#1C100A"
                  android:pathData="M28,28 L80,28 L80,42 L48,68 L80,68 L80,82 L28,82 L28,68 L60,42 L28,42 Z" />
              <path
                  android:fillColor="#FFFFFF"
                  android:pathData="M25,25 L77,25 L77,39 L45,65 L77,65 L77,79 L25,79 L25,65 L57,39 L25,39 Z" />
          </vector>
          EOF

      - name: "Robot Step 18: Create Adaptive Icon Configuration"
        run: |
          cat > app/src/main/res/mipmap-anydpi-v26/ic_launcher.xml <<'EOF'
          <?xml version="1.0" encoding="utf-8"?>
          <adaptive-icon xmlns:android="http://schemas.android.com/apk/res/android">
              <background android:drawable="@drawable/ic_launcher_bg" />
              <foreground android:drawable="@drawable/ic_launcher_fg" />
          </adaptive-icon>
          EOF

      # ==========================================
      # STEP 7: Core App Manifest & Pure English Logic
      # ==========================================
      - name: "Robot Step 19: Write AndroidManifest.xml Architecture"
        run: |
          cat > app/src/main/AndroidManifest.xml <<'EOF'
          <?xml version="1.0" encoding="utf-8"?>
          <manifest xmlns:android="http://schemas.android.com/apk/res/android">

              <application
                  android:allowBackup="false"
                  android:icon="@mipmap/ic_launcher"
                  android:label="@string/app_name"
                  android:roundIcon="@mipmap/ic_launcher"
                  android:supportsRtl="true"
                  android:theme="@style/Theme.AppCompat.DayNight.NoActionBar">

                  <activity
                      android:name=".MainActivity"
                      android:exported="true"
                      android:windowSoftInputMode="adjustResize">
                      <intent-filter>
                          <action android:name="android.intent.action.MAIN" />
                          <category android:name="android.intent.category.LAUNCHER" />
                      </intent-filter>
                  </activity>

              </application>
          </manifest>
          EOF

      - name: "Robot Step 20: Write MainActivity.kt (Fixed ANR & Limits)"
        run: |
          cat > app/src/main/java/com/zeeshan/notice/MainActivity.kt <<'EOF'
          package com.zeeshan.notice

          import android.app.AlertDialog
          import android.app.Dialog
          import android.content.ContentValues
          import android.content.Context
          import android.content.SharedPreferences
          import android.database.sqlite.SQLiteDatabase
          import android.database.sqlite.SQLiteOpenHelper
          import android.graphics.Canvas
          import android.graphics.Color
          import android.graphics.Paint
          import android.graphics.Typeface
          import android.graphics.drawable.GradientDrawable
          import android.os.Bundle
          import android.text.Editable
          import android.text.Html
          import android.text.InputType
          import android.text.Spannable
          import android.text.TextWatcher
          import android.text.style.ForegroundColorSpan
          import android.view.Gravity
          import android.view.MotionEvent
          import android.view.ScaleGestureDetector
          import android.view.View
          import android.view.ViewGroup
          import android.view.inputmethod.InputMethodManager
          import android.widget.*
          import androidx.appcompat.app.AppCompatActivity
          import androidx.core.view.GravityCompat
          import androidx.drawerlayout.widget.DrawerLayout
          import com.google.android.material.navigation.NavigationView
          import java.io.File
          import java.io.FileInputStream
          import java.io.FileOutputStream

          data class ItemModel(
              val id: Long,
              val title: String,
              val chunkFileName: String,
              val isFolder: Boolean,
              val parentFolderId: Long,
              val isLocked: Boolean,
              val isEditorLocked: Boolean = false
          )

          class DynamicCanvasEditText(context: Context) : androidx.appcompat.widget.AppCompatEditText(context) {
              var pageStyle: String = "Plain"
                  set(value) {
                      field = value
                      invalidate()
                  }

              private var scaleFactor = 1.0f
              private val baseTextSizeSp = 16f

              private val scaleDetector = ScaleGestureDetector(context, object : ScaleGestureDetector.SimpleOnScaleGestureListener() {
                  override fun onScale(detector: ScaleGestureDetector): Boolean {
                      scaleFactor *= detector.scaleFactor
                      scaleFactor = scaleFactor.coerceIn(1.0f, 6.0f)
                      textSize = baseTextSizeSp * scaleFactor
                      return true
                  }
              })

              override fun onTouchEvent(event: MotionEvent): Boolean {
                  if (!isFocusable) {
                      scaleDetector.onTouchEvent(event)
                  }
                  return super.onTouchEvent(event)
              }

              private val linePaint = Paint().apply {
                  color = Color.parseColor("#B0C4DE")
                  strokeWidth = 2f
              }

              private val marginPaint = Paint().apply {
                  color = Color.parseColor("#FF6B6B")
                  strokeWidth = 3f
              }

              override fun onDraw(canvas: Canvas) {
                  when (pageStyle) {
                      "Ruled" -> {
                          val lineH = lineHeight
                          val count = height / lineH
                          for (i in 1..count) {
                              val y = (i * lineH).toFloat()
                              canvas.drawLine(0f, y, width.toFloat(), y, linePaint)
                          }
                      }
                      "Grid" -> {
                          val step = 60f
                          var x = 0f
                          while (x < width) {
                              canvas.drawLine(x, 0f, x, height.toFloat(), linePaint)
                              x += step
                          }
                          var y = 0f
                          while (y < height) {
                              canvas.drawLine(0f, y, width.toFloat(), y, linePaint)
                              y += step
                          }
                      }
                      "Vertical" -> {
                          val lineH = lineHeight
                          val count = height / lineH
                          for (i in 1..count) {
                              val y = (i * lineH).toFloat()
                              canvas.drawLine(0f, y, width.toFloat(), y, linePaint)
                          }
                          canvas.drawLine(90f, 0f, 90f, height.toFloat(), marginPaint)
                      }
                  }
                  super.onDraw(canvas)
              }
          }

          class DatabaseHelper(context: Context) : SQLiteOpenHelper(context, "ZeeshanNotice.db", null, 6) {
              override fun onCreate(db: SQLiteDatabase) {
                  db.execSQL("CREATE TABLE items (id INTEGER PRIMARY KEY AUTOINCREMENT, title TEXT, chunk_file TEXT, is_folder INTEGER, parent_id INTEGER, is_locked INTEGER DEFAULT 0, is_editor_locked INTEGER DEFAULT 0)")
              }
              override fun onUpgrade(db: SQLiteDatabase, oldVersion: Int, newVersion: Int) {
                  if (oldVersion < 6) {
                      db.execSQL("DROP TABLE IF EXISTS items")
                      onCreate(db)
                  }
              }
          }

          class MainActivity : AppCompatActivity() {

              companion object {
                  init {
                      System.loadLibrary("native-lib")
                  }
                  // New limit: 30 MB
                  const val MAX_STORAGE_BYTES: Long = 30L * 1024L * 1024L 
              }

              private external fun getStorageUsageBytes(appDirPath: String): Long

              // FIX 1: Thread-safe cached memory tracking to avoid ANR on Main UI
              @Volatile private var currentUsedBytesCached: Long = 0L

              private lateinit var dbHelper: DatabaseHelper
              private lateinit var prefs: SharedPreferences
              private lateinit var drawerLayout: DrawerLayout
              private lateinit var mainContainer: LinearLayout
              private lateinit var dashboardHeader: FrameLayout
              private lateinit var projectHeader: LinearLayout
              private lateinit var dashboardTitleTv: TextView
              private lateinit var projectTitleTv: TextView
              private lateinit var drawerMemoryText: TextView
              private lateinit var drawerProgressView: View
              private lateinit var editorLayout: LinearLayout
              private lateinit var noticeListLayout: LinearLayout
              private lateinit var emptyStateTv: TextView
              private lateinit var noteEditText: DynamicCanvasEditText
              private lateinit var colorMenuBtn: Button
              private lateinit var lockToggleBtn: Button

              private var currentFolderId: Long = 0L
              private var editingNoteId: Long? = null
              private var editingChunkFile: String? = null
              private var selectedStyleTemp: String = "Plain"

              private var activeColor: Int = Color.BLACK
              private var isSelfTextChange = false
              private var isPageEditorLocked = true

              private val baseHueArray = floatArrayOf(
                  0f, 0f, 210f, 120f, 60f, 30f, 300f, 280f,
                  25f, 180f, 84f, 15f, 200f, 340f, 45f, 160f,
                  270f, 190f, 10f, 50f, 140f, 230f, 320f, 220f
              )

              private val color120Matrix = ArrayList<List<Int>>()
              private lateinit var chunkServerDir: File

              override fun onCreate(savedInstanceState: Bundle?) {
                  super.onCreate(savedInstanceState)
                  dbHelper = DatabaseHelper(this)
                  prefs = getSharedPreferences("ZeeshanNoticePrefs", Context.MODE_PRIVATE)

                  chunkServerDir = File(filesDir, "chunks")
                  if (!chunkServerDir.exists()) {
                      chunkServerDir.mkdirs()
                  }

                  generate120ColorsData()

                  drawerLayout = DrawerLayout(this).apply {
                      layoutParams = FrameLayout.LayoutParams(-1, -1)
                  }

                  mainContainer = LinearLayout(this).apply {
                      orientation = LinearLayout.VERTICAL
                      setBackgroundColor(Color.parseColor("#FDFBF7"))
                      layoutParams = FrameLayout.LayoutParams(-1, -1)
                  }

                  dashboardHeader = FrameLayout(this).apply {
                      setBackgroundColor(Color.parseColor("#3D2314"))
                      setPadding(20, 25, 20, 25)
                      elevation = 14f
                      layoutParams = LinearLayout.LayoutParams(-1, -2)
                  }

                  val menuBtn = TextView(this).apply {
                      text = "≡"
                      textSize = 28f
                      setTextColor(Color.WHITE)
                      setTypeface(null, Typeface.BOLD)
                      setPadding(20, 0, 20, 0)
                      layoutParams = FrameLayout.LayoutParams(-2, -2, Gravity.START or Gravity.CENTER_VERTICAL)
                      setOnClickListener { drawerLayout.openDrawer(GravityCompat.START) }
                  }

                  dashboardTitleTv = TextView(this).apply {
                      text = "𝐙𝐞𝐞𝐬𝐡𝐚𝐧 𝐍𝐨𝐭𝐢𝐜𝐞"
                      textSize = 22f
                      setTypeface(null, Typeface.BOLD)
                      setTextColor(Color.parseColor("#FDFBF7"))
                      setShadowLayer(8f, 3f, 5f, Color.parseColor("#1C100A"))
                      gravity = Gravity.CENTER
                      layoutParams = FrameLayout.LayoutParams(-1, -2, Gravity.CENTER)
                  }

                  dashboardHeader.addView(dashboardTitleTv)
                  dashboardHeader.addView(menuBtn)

                  projectHeader = LinearLayout(this).apply {
                      orientation = LinearLayout.HORIZONTAL
                      gravity = Gravity.CENTER_VERTICAL
                      setPadding(30, 35, 30, 35)
                      setBackgroundColor(Color.parseColor("#3D2314"))
                      visibility = View.GONE
                      elevation = 14f
                  }

                  val backBtn = TextView(this).apply {
                      text = "←"
                      textSize = 26f
                      setTextColor(Color.WHITE)
                      setTypeface(null, Typeface.BOLD)
                      setPadding(0, 0, 25, 0)
                      setOnClickListener { closeEditor() }
                  }

                  projectTitleTv = TextView(this).apply {
                      text = "New Page"
                      textSize = 18f
                      setTypeface(null, Typeface.BOLD)
                      setTextColor(Color.WHITE)
                      layoutParams = LinearLayout.LayoutParams(0, -2, 1f)
                  }

                  val saveBtn = TextView(this).apply {
                      text = "✔ SAVE"
                      textSize = 15f
                      setTypeface(null, Typeface.BOLD)
                      setTextColor(Color.parseColor("#D4AF37"))
                      setOnClickListener { saveCurrentNoteChunk() }
                  }

                  projectHeader.addView(backBtn)
                  projectHeader.addView(projectTitleTv)
                  projectHeader.addView(saveBtn)

                  noticeListLayout = LinearLayout(this).apply {
                      orientation = LinearLayout.VERTICAL
                      setPadding(30, 30, 30, 30)
                      layoutParams = LinearLayout.LayoutParams(-1, 0, 1f)
                  }

                  emptyStateTv = TextView(this).apply {
                      text = "No folders or pages available.\nTap '+' below to create a new folder or page."
                      textSize = 15f
                      setTextColor(Color.GRAY)
                      gravity = Gravity.CENTER
                      layoutParams = LinearLayout.LayoutParams(-1, -1)
                  }
                  noticeListLayout.addView(emptyStateTv)

                  editorLayout = LinearLayout(this).apply {
                      orientation = LinearLayout.VERTICAL
                      setBackgroundColor(Color.WHITE)
                      visibility = View.GONE
                      layoutParams = LinearLayout.LayoutParams(-1, -1, 1f)
                  }

                  val styleToolBar = LinearLayout(this).apply {
                      orientation = LinearLayout.HORIZONTAL
                      gravity = Gravity.END or Gravity.CENTER_VERTICAL
                      setPadding(20, 15, 20, 15)
                      setBackgroundColor(Color.parseColor("#F5EFE6"))
                  }

                  colorMenuBtn = Button(this).apply {
                      text = "🎨 Color"
                      textSize = 13f
                      setTextColor(Color.BLACK)
                      setTypeface(null, Typeface.BOLD)
                      background = GradientDrawable().apply {
                          setColor(Color.WHITE)
                          cornerRadius = 20f
