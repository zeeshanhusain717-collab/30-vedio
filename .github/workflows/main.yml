name: Build Z+2 Vedio player App APK 100% Working

on:
  push:
    branches: [ "main", "master" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v3
        with:
          gradle-version: '8.2'

      - name: Step 1 - Create Project Folders
        run: |
          mkdir -p app/src/main/java/com/app/zplus2
          mkdir -p app/src/main/res/layout
          mkdir -p app/src/main/res/values
          mkdir -p app/src/main/res/drawable

      - name: Step 2 - Create Gradle Properties
        run: |
          cat << 'EOF' > gradle.properties
          org.gradle.jvmargs=-Xmx2048m -Dfile.encoding=UTF-8
          android.useAndroidX=true
          android.enableJetifier=true
          EOF

      - name: Step 3 - Create settings.gradle & Root build.gradle
        run: |
          cat << 'EOF' > settings.gradle
          pluginManagement {
              repositories {
                  google()
                  mavenCentral()
                  gradlePluginPortal()
              }
          }
          dependencyResolutionManagement {
              repositoriesMode.set(RepositoriesMode.FAIL_ON_PROJECT_REPOS)
              repositories {
                  google()
                  mavenCentral()
              }
          }
          rootProject.name = "Z+2 Vedio player"
          include ':app'
          EOF
          
          cat << 'EOF' > build.gradle
          plugins {
              id 'com.android.application' version '8.2.0' apply false
              id 'org.jetbrains.kotlin.android' version '1.9.20' apply false
          }
          EOF

      - name: Step 4 - Create App Level build.gradle
        run: |
          cat << 'EOF' > app/build.gradle
          plugins {
              id 'com.android.application'
              id 'org.jetbrains.kotlin.android'
          }

          android {
              namespace 'com.app.zplus2'
              compileSdk 34

              defaultConfig {
                  applicationId "com.app.zplus2"
                  minSdk 24
                  targetSdk 34
                  versionCode 1
                  versionName "1.0"
              }

              compileOptions {
                  sourceCompatibility JavaVersion.VERSION_17
                  targetCompatibility JavaVersion.VERSION_17
              }
              kotlinOptions {
                  jvmTarget = '17'
              }
          }

          dependencies {
              implementation 'androidx.core:core-ktx:1.12.0'
              implementation 'androidx.appcompat:appcompat:1.6.1'
              implementation 'com.google.android.material:material:1.11.0'
              implementation 'androidx.recyclerview:recyclerview:1.3.2'
              
              // Google Media3 / ExoPlayer Video Engine
              implementation 'androidx.media3:media3-exoplayer:1.2.1'
              implementation 'androidx.media3:media3-ui:1.2.1'
          }
          EOF

      - name: Step 5 - Create App Resources (UI, Layouts & Icon)
        run: |
          # App Icon Vector
          cat << 'EOF' > app/src/main/res/drawable/ic_app_icon.xml
          <vector xmlns:android="http://schemas.android.com/apk/res/android"
              android:width="512dp"
              android:height="512dp"
              android:viewportWidth="512"
              android:viewportHeight="512">
              <path
                  android:fillColor="#FFFFFF"
                  android:pathData="M0,0h512v512h-512z" />
              <path
                  android:strokeColor="#4E342E"
                  android:strokeWidth="24"
                  android:pathData="M 256, 44 A 212, 212 0 1,0 256, 468 A 212, 212 0 1,0 256, 44 Z" />
              <path
                  android:strokeColor="#4E342E"
                  android:strokeWidth="48"
                  android:strokeLineCap="square"
                  android:strokeLineJoin="miter"
                  android:pathData="M 160, 160 L 352, 160 L 160, 352 L 352, 352" />
          </vector>
          EOF

          cat << 'EOF' > app/src/main/res/values/styles.xml
          <?xml version="1.0" encoding="utf-8"?>
          <resources>
              <style name="AppTheme" parent="Theme.MaterialComponents.DayNight.NoActionBar">
                  <item name="colorPrimary">#4E342E</item>
              </style>
          </resources>
          EOF
          
          # Activity Main with Top Chocolate Header Bar
          cat << 'EOF' > app/src/main/res/layout/activity_main.xml
          <?xml version="1.0" encoding="utf-8"?>
          <LinearLayout xmlns:android="http://schemas.android.com/apk/res/android"
              android:layout_width="match_parent"
              android:layout_height="match_parent"
              android:orientation="vertical"
              android:background="#121212">

              <!-- Top Header Bar (चाकलेटी पट्टी) -->
              <RelativeLayout
                  android:id="@+id/headerBar"
                  android:layout_width="match_parent"
                  android:layout_height="56dp"
                  android:background="#4E342E"
                  android:paddingStart="16dp"
                  android:paddingEnd="16dp">

                  <TextView
                      android:id="@+id/tvHeaderTitle"
                      android:layout_width="wrap_content"
                      android:layout_height="wrap_content"
                      android:layout_centerVertical="true"
                      android:text="Zeeshan vedio"
                      android:textColor="#FFFFFF"
                      android:textSize="20sp"
                      android:textStyle="bold" />
              </RelativeLayout>

              <!-- Video Player -->
              <androidx.media3.ui.PlayerView
                  android:id="@+id/playerView"
                  android:layout_width="match_parent"
                  android:layout_height="220dp"
                  android:background="#000000" />

              <!-- Folders / Videos List -->
              <androidx.recyclerview.widget.RecyclerView
                  android:id="@+id/recyclerView"
                  android:layout_width="match_parent"
                  android:layout_height="match_parent"
                  android:padding="8dp" />
          </LinearLayout>
          EOF

          # Item Folder Layout
          cat << 'EOF' > app/src/main/res/layout/item_folder.xml
          <?xml version="1.0" encoding="utf-8"?>
          <LinearLayout xmlns:android="http://schemas.android.com/apk/res/android"
              android:layout_width="match_parent"
              android:layout_height="wrap_content"
              android:orientation="horizontal"
              android:padding="14dp"
              android:layout_marginBottom="6dp"
              android:gravity="center_vertical"
              android:background="#1E1E1E">

              <TextView
                  android:layout_width="wrap_content"
                  android:layout_height="wrap_content"
                  android:text="📁"
                  android:textSize="22sp" />

              <LinearLayout
                  android:layout_width="0dp"
                  android:layout_weight="1"
                  android:layout_height="wrap_content"
                  android:orientation="vertical"
                  android:layout_marginStart="12dp">

                  <TextView
                      android:id="@+id/tvFolderName"
                      android:layout_width="match_parent"
                      android:layout_height="wrap_content"
                      android:textColor="#FFFFFF"
                      android:textSize="16sp"
                      android:textStyle="bold"
                      android:maxLines="1"
                      android:ellipsize="end" />

                  <TextView
                      android:id="@+id/tvVideoCount"
                      android:layout_width="match_parent"
                      android:layout_height="wrap_content"
                      android:textColor="#B0B0B0"
                      android:textSize="12sp"
                      android:layout_marginTop="2dp" />
              </LinearLayout>
          </LinearLayout>
          EOF
          
          # Item Video Layout
          cat << 'EOF' > app/src/main/res/layout/item_video.xml
          <?xml version="1.0" encoding="utf-8"?>
          <LinearLayout xmlns:android="http://schemas.android.com/apk/res/android"
              android:layout_width="match_parent"
              android:layout_height="wrap_content"
              android:orientation="horizontal"
              android:padding="12dp"
              android:layout_marginBottom="6dp"
              android:gravity="center_vertical"
              android:background="#1E1E1E">

              <TextView
                  android:layout_width="wrap_content"
                  android:layout_height="wrap_content"
                  android:text="🎬"
                  android:textSize="18sp" />

              <TextView
                  android:id="@+id/tvTitle"
                  android:layout_width="match_parent"
                  android:layout_height="wrap_content"
                  android:layout_marginStart="10dp"
                  android:textColor="#FFFFFF"
                  android:textSize="15sp"
                  android:textStyle="bold"
                  android:maxLines="1"
                  android:ellipsize="end" />
          </LinearLayout>
          EOF

      - name: Step 6 - Create AndroidManifest.xml
        run: |
          cat << 'EOF' > app/src/main/AndroidManifest.xml
          <?xml version="1.0" encoding="utf-8"?>
          <manifest xmlns:android="http://schemas.android.com/apk/res/android">
              <uses-permission android:name="android.permission.READ_EXTERNAL_STORAGE" android:maxSdkVersion="32" />
              <uses-permission android:name="android.permission.READ_MEDIA_VIDEO" />

              <application
                  android:allowBackup="true"
                  android:icon="@drawable/ic_app_icon"
                  android:roundIcon="@drawable/ic_app_icon"
                  android:label="Z+2 Vedio player"
                  android:supportsRtl="true"
                  android:theme="@style/AppTheme">
                  <activity
                      android:name=".MainActivity"
                      android:exported="true"
                      android:configChanges="orientation|screenSize|keyboardHidden">
                      <intent-filter>
                          <action android:name="android.intent.action.MAIN" />
                          <category android:name="android.intent.category.LAUNCHER" />
                      </intent-filter>
                  </activity>
              </application>
          </manifest>
          EOF

      - name: Step 7 - Create Kotlin Code (Folder Navigation & Video Engine)
        run: |
          cat << 'EOF' > app/src/main/java/com/app/zplus2/MainActivity.kt
          package com.app.zplus2

          import android.Manifest
          import android.content.ContentUris
          import android.content.pm.PackageManager
          import android.net.Uri
          import android.os.Build
          import android.os.Bundle
          import android.provider.MediaStore
          import android.view.LayoutInflater
          import android.view.View
          import android.view.ViewGroup
          import android.widget.TextView
          import android.widget.Toast
          import androidx.activity.OnBackPressedCallback
          import androidx.appcompat.app.AppCompatActivity
          import androidx.core.app.ActivityCompat
          import androidx.core.content.ContextCompat
          import androidx.media3.common.MediaItem
          import androidx.media3.exoplayer.ExoPlayer
          import androidx.media3.ui.PlayerView
          import androidx.recyclerview.widget.LinearLayoutManager
          import androidx.recyclerview.widget.RecyclerView

          data class VideoModel(val id: Long, val name: String, val uri: Uri, val folderName: String)
          data class FolderModel(val folderName: String, val videos: List<VideoModel>)

          class MainActivity : AppCompatActivity() {

              private var player: ExoPlayer? = null
              private lateinit var playerView: PlayerView
              private lateinit var recyclerView: RecyclerView
              private lateinit var tvHeaderTitle: TextView
              private val PERMISSION_REQ_CODE = 101

              private var allFolders = listOf<FolderModel>()
              private var currentFolder: FolderModel? = null

              override fun onCreate(savedInstanceState: Bundle?) {
                  super.onCreate(savedInstanceState)
                  setContentView(R.layout.activity_main)

                  tvHeaderTitle = findViewById(R.id.tvHeaderTitle)
                  playerView = findViewById(R.id.playerView)
                  recyclerView = findViewById(R.id.recyclerView)
                  recyclerView.layoutManager = LinearLayoutManager(this)

                  initializePlayer()
                  checkAndRequestPermissions()

                  // Back gesture logic to navigate from videos to folder list
                  onBackPressedDispatcher.addCallback(this, object : OnBackPressedCallback(true) {
                      override fun handleOnBackPressed() {
                          if (currentFolder != null) {
                              showFoldersList()
                          } else {
                              isEnabled = false
                              onBackPressedDispatcher.onBackPressed()
                          }
                      }
                  })
              }

              private fun initializePlayer() {
                  player = ExoPlayer.Builder(this).build()
                  playerView.player = player
              }

              private fun checkAndRequestPermissions() {
                  val permission = if (Build.VERSION.SDK_INT >= Build.VERSION_CODES.TIRAMISU) {
                      Manifest.permission.READ_MEDIA_VIDEO
                  } else {
                      Manifest.permission.READ_EXTERNAL_STORAGE
                  }

                  if (ContextCompat.checkSelfPermission(this, permission) != PackageManager.PERMISSION_GRANTED) {
                      ActivityCompat.requestPermissions(this, arrayOf(permission), PERMISSION_REQ_CODE)
                  } else {
                      scanAndDisplayContent()
                  }
              }

              override fun onRequestPermissionsResult(
                  requestCode: Int,
                  permissions: Array<out String>,
                  grantResults: IntArray
              ) {
                  super.onRequestPermissionsResult(requestCode, permissions, grantResults)
                  if (requestCode == PERMISSION_REQ_CODE && grantResults.isNotEmpty() && grantResults[0] == PackageManager.PERMISSION_GRANTED) {
                      scanAndDisplayContent()
                  } else {
                      Toast.makeText(this, "वीडियो देखने के लिए परमिशन ज़रूरी है!", Toast.LENGTH_LONG).show()
                  }
              }

              private fun scanAndDisplayContent() {
                  val folderMap = mutableMapOf<String, MutableList<VideoModel>>()
                  val projection = arrayOf(
                      MediaStore.Video.Media._ID,
                      MediaStore.Video.Media.DISPLAY_NAME,
                      MediaStore.Video.Media.BUCKET_DISPLAY_NAME
                  )

                  contentResolver.query(
                      MediaStore.Video.Media.EXTERNAL_CONTENT_URI,
                      projection, null, null, MediaStore.Video.Media.DATE_ADDED + " DESC"
                  )?.use { cursor ->
                      val idCol = cursor.getColumnIndexOrThrow(MediaStore.Video.Media._ID)
                      val nameCol = cursor.getColumnIndexOrThrow(MediaStore.Video.Media.DISPLAY_NAME)
                      val bucketCol = cursor.getColumnIndex(MediaStore.Video.Media.BUCKET_DISPLAY_NAME)

                      while (cursor.moveToNext()) {
                          val id = cursor.getLong(idCol)
                          val name = cursor.getString(nameCol) ?: "Unknown Video"
                          val folderName = if (bucketCol != -1) cursor.getString(bucketCol) ?: "Videos" else "Videos"
                          val contentUri = ContentUris.withAppendedId(MediaStore.Video.Media.EXTERNAL_CONTENT_URI, id)

                          val video = VideoModel(id, name, contentUri, folderName)
                          folderMap.getOrPut(folderName) { mutableListOf() }.add(video)
                      }
                  }

                  allFolders = folderMap.map { FolderModel(it.key, it.value) }

                  if (allFolders.isNotEmpty()) {
                      showFoldersList()
                  } else {
                      Toast.makeText(this, "मोबाइल में कोई वीडियो नहीं मिला!", Toast.LENGTH_SHORT).show()
                  }
              }

              private fun showFoldersList() {
                  currentFolder = null
                  tvHeaderTitle.text = "Zeeshan vedio"
                  recyclerView.adapter = FolderAdapter(allFolders) { selectedFolder ->
                      showVideosList(selectedFolder)
                  }
              }

              private fun showVideosList(folder: FolderModel) {
                  currentFolder = folder
                  tvHeaderTitle.text = folder.folderName
                  recyclerView.adapter = VideoAdapter(folder.videos) { selectedVideo ->
                      playVideo(selectedVideo)
                  }
              }

              private fun playVideo(video: VideoModel) {
                  val mediaItem = MediaItem.fromUri(video.uri)
                  player?.setMediaItem(mediaItem)
                  player?.prepare()
                  player?.playWhenReady = true
              }

              override fun onStop() {
                  super.onStop()
                  player?.pause()
              }

              override fun onDestroy() {
                  super.onDestroy()
                  player?.release()
                  player = null
              }

              // Folder Adapter
              inner class FolderAdapter(
                  private val list: List<FolderModel>,
                  private val onClick: (FolderModel) -> Unit
              ) : RecyclerView.Adapter<FolderAdapter.ViewHolder>() {

                  inner class ViewHolder(v: View) : RecyclerView.ViewHolder(v) {
                      val tvFolderName: TextView = v.findViewById(R.id.tvFolderName)
                      val tvVideoCount: TextView = v.findViewById(R.id.tvVideoCount)
                  }

                  override fun onCreateViewHolder(parent: ViewGroup, viewType: Int): ViewHolder {
                      val v = LayoutInflater.from(parent.context).inflate(R.layout.item_folder, parent, false)
                      return ViewHolder(v)
                  }

                  override fun onBindViewHolder(holder: ViewHolder, position: Int) {
                      val item = list[position]
                      holder.tvFolderName.text = item.folderName
                      holder.tvVideoCount.text = "${item.videos.size} Videos"
                      holder.itemView.setOnClickListener { onClick(item) }
                  }

                  override fun getItemCount() = list.size
              }

              // Video Adapter
              inner class VideoAdapter(
                  private val list: List<VideoModel>,
                  private val onClick: (VideoModel) -> Unit
              ) : RecyclerView.Adapter<VideoAdapter
