name: Build Advance Zeeshan Video App APK

on:
  push:
    branches: [ "main", "master" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: Set up JDK 17
      uses: actions/setup-java@v4
      with:
        java-version: '17'
        distribution: 'temurin'

    - name: Setup Gradle
      uses: gradle/actions/setup-gradle@v3
      with:
        gradle-version: '8.2'

    - name: Step 1 - Setup Project Structure
      run: |
        mkdir -p app/src/main/java/com/app/zvedios
        mkdir -p app/src/main/res/layout
        mkdir -p app/src/main/res/values
        mkdir -p app/src/main/res/drawable
        mkdir -p app/src/main/res/mipmap-anydpi-v26

    - name: Step 2 - Create Configs (Strings, Colors, Styles)
      run: |
        # Strings.xml (App Name & Toolbar Name)
        cat << 'EOF' > app/src/main/res/values/strings.xml
        <resources>
            <string name="app_name">Z+2 Vedios</string>
            <string name="toolbar_title">Zeeshan vedios</string>
        </resources>
        EOF

        # Colors.xml
        cat << 'EOF' > app/src/main/res/values/colors.xml
        <resources>
            <color name="black">#000000</color>
            <color name="dark_grey">#121212</color>
            <color name="gold">#FFD700</color>
            <color name="white">#FFFFFF</color>
        </resources>
        EOF

        # Styles.xml
        cat << 'EOF' > app/src/main/res/values/styles.xml
        <resources>
            <style name="AppTheme" parent="Theme.MaterialComponents.DayNight.NoActionBar">
                <item name="android:statusBarColor">#000000</item>
            </style>
        </resources>
        EOF

    - name: Step 3 - Create App Icon (Code Generated Z Logo)
      run: |
        # Icon XML
        cat << 'EOF' > app/src/main/res/drawable/ic_app_icon.xml
        <vector xmlns:android="http://schemas.android.com/apk/res/android"
            android:width="108dp" android:height="108dp"
            android:viewportWidth="100" android:viewportHeight="100">
            <!-- Golden Circle -->
            <path android:fillColor="#FFD700" android:pathData="M 50,5 C 25.15,5 5,25.15 5,50 C 5,74.85 25.15,95 50,95 C 74.85,95 95,74.85 95,50 C 95,25.15 74.85,5 50,5 Z" />
            <!-- Chocolate & Blue Z -->
            <path android:fillColor="#D2691E" android:pathData="M 25,30 L 75,30 L 75,40 L 40,70 L 75,70 L 75,80 L 25,80 L 25,70 L 60,40 L 25,40 Z" />
            <path android:fillColor="#0000FF" android:pathData="M 22,27 L 72,27 L 72,37 L 37,67 L 72,67 L 72,77 L 22,77 L 22,67 L 57,37 L 22,37 Z" />
        </vector>
        EOF

        # Adaptive Icon Setup
        cat << 'EOF' > app/src/main/res/mipmap-anydpi-v26/ic_launcher.xml
        <adaptive-icon xmlns:android="http://schemas.android.com/apk/res/android">
            <background android:drawable="@color/black"/>
            <foreground android:drawable="@drawable/ic_app_icon"/>
        </adaptive-icon>
        EOF

    - name: Step 4 - Create Layouts (Folder View & Video List)
      run: |
        # Main Activity Layout (Folder View)
        cat << 'EOF' > app/src/main/res/layout/activity_main.xml
        <LinearLayout xmlns:android="http://schemas.android.com/apk/res/android"
            android:layout_width="match_parent" android:layout_height="match_parent"
            android:orientation="vertical" android:background="#121212">
            <TextView android:layout_width="match_parent" android:layout_height="?attr/actionBarSize"
                android:text="@string/toolbar_title" android:gravity="center_vertical"
                android:paddingStart="16dp" android:textColor="#FFD700"
                android:textSize="20sp" android:textStyle="bold" android:background="#1F1F1F"/>
            <androidx.recyclerview.widget.RecyclerView android:id="@+id/rvFolders"
                android:layout_width="match_parent" android:layout_height="match_parent"/>
        </LinearLayout>
        EOF

    - name: Step 5 - Create Kotlin Source (Advanced Logic)
      run: |
        # Main Activity (Scanner Logic)
        cat << 'EOF' > app/src/main/java/com/app/zvedios/MainActivity.kt
        package com.app.zvedios
        import android.Manifest
        import android.content.Intent
        import android.content.pm.PackageManager
        import android.os.Build
        import android.os.Bundle
        import android.provider.MediaStore
        import android.view.LayoutInflater
        import android.view.View
        import android.view.ViewGroup
        import android.widget.TextView
        import androidx.appcompat.app.AppCompatActivity
        import androidx.core.app.ActivityCompat
        import androidx.core.content.ContextCompat
        import androidx.recyclerview.widget.LinearLayoutManager
        import androidx.recyclerview.widget.RecyclerView

        data class Folder(val id: String, val name: String)

        class MainActivity : AppCompatActivity() {
            override fun onCreate(savedInstanceState: Bundle?) {
                super.onCreate(savedInstanceState)
                setContentView(R.layout.activity_main)
                val rv = findViewById<RecyclerView>(R.id.rvFolders)
                rv.layoutManager = LinearLayoutManager(this)
                
                if (Build.VERSION.SDK_INT >= Build.VERSION_CODES.TIRAMISU) {
                    if (ContextCompat.checkSelfPermission(this, Manifest.permission.READ_MEDIA_VIDEO) != PackageManager.PERMISSION_GRANTED) {
                        ActivityCompat.requestPermissions(this, arrayOf(Manifest.permission.READ_MEDIA_VIDEO), 1)
                    } else loadFolders(rv)
                } else {
                    ActivityCompat.requestPermissions(this, arrayOf(Manifest.permission.READ_EXTERNAL_STORAGE), 1)
                }
            }

            private fun loadFolders(rv: RecyclerView) {
                val folders = mutableListOf<Folder>()
                val cursor = contentResolver.query(MediaStore.Video.Media.EXTERNAL_CONTENT_URI, arrayOf(MediaStore.Video.Media.BUCKET_ID, MediaStore.Video.Media.BUCKET_DISPLAY_NAME), null, null, null)
                val set = mutableSetOf<String>()
                cursor?.use {
                    val idCol = it.getColumnIndexOrThrow(MediaStore.Video.Media.BUCKET_ID)
                    val nameCol = it.getColumnIndexOrThrow(MediaStore.Video.Media.BUCKET_DISPLAY_NAME)
                    while(it.moveToNext()){
                        val id = it.getString(idCol)
                        val name = it.getString(nameCol) ?: "Internal"
                        if(set.add(id)) folders.add(Folder(id, name))
                    }
                }
                rv.adapter = FolderAdapter(folders) { f ->
                    val i = Intent(this, VideoListActivity::class.java)
                    i.putExtra("ID", f.id)
                    i.putExtra("NAME", f.name)
                    startActivity(i)
                }
            }
        }
        
        class FolderAdapter(val list: List<Folder>, val onClick: (Folder) -> Unit): RecyclerView.Adapter<FolderAdapter.VH>() {
            class VH(v: View): RecyclerView.ViewHolder(v) { val t: TextView = v.findViewById(android.R.id.text1) }
            override fun onCreateViewHolder(p: ViewGroup, t: Int) = VH(LayoutInflater.from(p.context).inflate(android.R.layout.simple_list_item_1, p, false).apply{ findViewById<TextView>(android.R.id.text1).setTextColor(-1) })
            override fun onBindViewHolder(h: VH, p: Int) { h.t.text = list[p].name; h.itemView.setOnClickListener { onClick(list[p]) } }
            override fun getItemCount() = list.size
        }
        EOF

        # Video List Activity (With Duration & Size)
        cat << 'EOF' > app/src/main/java/com/app/zvedios/VideoListActivity.kt
        package com.app.zvedios
        import android.content.ContentUris
        import android.content.Intent
        import android.net.Uri
        import android.os.Bundle
        import android.provider.MediaStore
        import android.view.LayoutInflater
        import android.view.View
        import android.view.ViewGroup
        import android.widget.TextView
        import androidx.appcompat.app.AppCompatActivity
        import androidx.recyclerview.widget.LinearLayoutManager
        import androidx.recyclerview.widget.RecyclerView
        import java.util.concurrent.TimeUnit

        class VideoListActivity : AppCompatActivity() {
            override fun onCreate(savedInstanceState: Bundle?) {
                super.onCreate(savedInstanceState)
                val rv = RecyclerView(this)
                rv.layoutManager = LinearLayoutManager(this)
                setContentView(rv)
                val bucketId = intent.getStringExtra("ID")
                
                val list = mutableListOf<String>() // Simple string list for demo
                val cursor = contentResolver.query(MediaStore.Video.Media.EXTERNAL_CONTENT_URI, 
                    arrayOf(MediaStore.Video.Media.DISPLAY_NAME, MediaStore.Video.Media.SIZE, MediaStore.Video.Media.DURATION, MediaStore.Video.Media._ID), 
                    "${MediaStore.Video.Media.BUCKET_ID} = ?", arrayOf(bucketId), null)
                
                cursor?.use {
                    while(it.moveToNext()){
                        val name = it.getString(0)
                        val size = it.getLong(1) / 1024 / 1024
                        val dur = TimeUnit.MILLISECONDS.toMinutes(it.getLong(2))
                        val id = it.getLong(3)
                        val uri = ContentUris.withAppendedId(MediaStore.Video.Media.EXTERNAL_CONTENT_URI, id)
                        rv.adapter = VideoAdapter(mutableListOf(Pair("$name\n$dur min | $size MB", uri))) { u ->
                            val intent = Intent(Intent.ACTION_VIEW)
                            intent.setDataAndType(u, "video/*")
                            startActivity(intent)
                        }
                    }
                }
            }
        }
        class VideoAdapter(val list: MutableList<Pair<String, Uri>>, val onClick: (Uri) -> Unit): RecyclerView.Adapter<VideoAdapter.VH>() {
            class VH(v: View): RecyclerView.ViewHolder(v) { val t: TextView = v.findViewById(android.R.id.text1) }
            override fun onCreateViewHolder(p: ViewGroup, t: Int) = VH(LayoutInflater.from(p.context).inflate(android.R.layout.simple_list_item_1, p, false).apply{ findViewById<TextView>(android.R.id.text1).setTextColor(-1) })
            override fun onBindViewHolder(h: VH, p: Int) { h.t.text = list[p].first; h.itemView.setOnClickListener { onClick(list[p].second) } }
            override fun getItemCount() = list.size
        }
        EOF

    - name: Step 6 - Manifest & Build
      run: |
        cat << 'EOF' > app/src/main/AndroidManifest.xml
        <manifest xmlns:android="http://schemas.android.com/apk/res/android">
            <uses-permission android:name="android.permission.READ_EXTERNAL_STORAGE" />
            <uses-permission android:name="android.permission.READ_MEDIA_VIDEO" />
            <application android:icon="@mipmap/ic_launcher" android:label="@string/app_name" android:theme="@style/AppTheme">
                <activity android:name=".MainActivity" android:exported="true">
                    <intent-filter><action android:name="android.intent.action.MAIN"/><category android:name="android.intent.category.LAUNCHER"/></intent-filter>
                </activity>
                <activity android:name=".VideoListActivity" />
            </application>
        </manifest>
        EOF

        # Gradle Files Generation
        cat << 'EOF' > app/build.gradle
        plugins { id 'com.android.application'; id 'org.jetbrains.kotlin.android' }
        android { 
            namespace 'com.app.zvedios'; compileSdk 34 
            defaultConfig { applicationId "com.app.zvedios"; minSdk 24; targetSdk 34; versionCode 1; versionName "1.0" }
        }
        dependencies { 
            implementation 'androidx.core:core-ktx:1.12.0'; implementation 'androidx.appcompat:appcompat:1.6.1'
            implementation 'com.google.android.material:material:1.11.0'
        }
        EOF
        
        gradle wrapper
        ./gradlew assembleDebug

    - name: Upload APK
      uses: actions/upload-artifact@v4
      with:
        name: Zeeshan-Vedios-APK
        path: app/build/outputs/apk/debug/app-debug.apk
        
